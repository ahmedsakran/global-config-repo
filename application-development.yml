security:
  jwt:
    enabled: true
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}        # 15 min
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# logging:
#   level:
#     root: INFO
#     com.mebroker: DEBUG
#     org.hibernate.SQL: DEBUG
#     org.hibernate.orm.jdbc.bind: TRACE

logging:
  level:
    root: INFO
    com.m.authservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE


management:
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}       # set this in environment or Config Server
    password: ${MAIL_PASSWORD}       # set this in environment or Config Server
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true